<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <rect width="50" height="50" fill="#3a3733"/>
  <!-- Batentes laterais da parede -->
  <rect x="0" y="15" width="10" height="20" fill="#522b29" stroke="#381c1b" stroke-width="1.2"/>
  <rect x="40" y="15" width="10" height="20" fill="#522b29" stroke="#381c1b" stroke-width="1.2"/>
  <!-- Porta de aço reforçada (Fechada) -->
  <rect x="10" y="20" width="30" height="10" fill="#525866" stroke="#292c33" stroke-width="1.8" rx="1"/>
  <!-- Tranca/Fechadura militar -->
  <circle cx="25" cy="25" r="2.5" fill="#f59e0b" stroke="#78350f" stroke-width="0.8"/>
  <line x1="12" y1="25" x2="22" y2="25" stroke="#374151" stroke-width="1.5"/>
  <line x1="28" y1="25" x2="38" y2="25" stroke="#374151" stroke-width="1.5"/>
</svg>
