  <line x1="0" y1="12" x2="50" y2="12" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="0" y1="25" x2="50" y2="25" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="0" y1="37" x2="50" y2="37" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="16" y1="0" x2="16" y2="12" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="36" y1="0" x2="36" y2="12" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="8" y1="12" x2="8" y2="25" stroke="#2b1413" stroke-width="1.5"/>
  <line x1="28" y1="12" x2="28" y2="25" stroke="#2b1413" stroke-width="1.5"/>
