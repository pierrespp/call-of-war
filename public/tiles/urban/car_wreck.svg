  <rect x="14" y="22" width="22" height="12" fill="#2e333a" rx="1"/>
  <!-- Vidro traseiro -->
  <path d="M15 34 L35 34 L37 39 L13 39 Z" fill="#1b2430" stroke="#121820" stroke-width="1"/>
