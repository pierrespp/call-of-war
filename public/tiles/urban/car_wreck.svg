  <ellipse cx="20" cy="18" rx="6" ry="4" fill="#181412" opacity="0.8"/>
  <ellipse cx="32" cy="28" rx="5" ry="3" fill="#181412" opacity="0.7"/>
  <!-- Faróis -->
