<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <rect width="50" height="50" fill="#26272b"/>
  <!-- Sombra da caçamba -->
  <rect x="7" y="10" width="38" height="32" fill="#111214" opacity="0.6" rx="2"/>
  <!-- Corpo da Caçamba de Aço Verde Militar / Industrial -->
  <rect x="5" y="8" width="40" height="30" fill="#275038" stroke="#142c1e" stroke-width="1.8" rx="2"/>
  <!-- Nervuras da tampa de aço -->
  <line x1="5" y1="18" x2="45" y2="18" stroke="#1e3e2b" stroke-width="2"/>
  <line x1="5" y1="28" x2="45" y2="28" stroke="#1e3e2b" stroke-width="2"/>
  <line x1="25" y1="8" x2="25" y2="38" stroke="#142c1e" stroke-width="2"/>
  <!-- Alças e ferrugem -->
  <rect x="2" y="20" width="3" height="6" fill="#854d0e" rx="1"/>
  <rect x="45" y="20" width="3" height="6" fill="#854d0e" rx="1"/>
  <circle cx="16" cy="14" r="2" fill="#78350f" opacity="0.6"/>
</svg>
