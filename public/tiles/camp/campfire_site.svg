  <ellipse cx="25" cy="14" rx="5" ry="4" fill="#666c75" stroke="#33373c" stroke-width="0.8"/>
  <ellipse cx="36" cy="18" rx="5" ry="4" fill="#555a61" stroke="#33373c" stroke-width="0.8"/>
