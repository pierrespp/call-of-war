<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Água visível por baixo da ponte nas laterais -->
  <rect width="50" height="50" fill="#153b4d"/>
  <!-- Sombra da ponte projetada na água -->
  <rect x="5" y="6" width="40" height="38" fill="#0c1d24" opacity="0.6"/>
  <!-- Vigas longitudinais de sustentação -->
  <rect x="4" y="6" width="42" height="4" fill="#3d2c18" stroke="#22180d" stroke-width="0.8"/>
  <rect x="4" y="40" width="42" height="4" fill="#3d2c18" stroke="#22180d" stroke-width="0.8"/>
  <!-- Tábuas transversais da ponte de madeira -->
  <rect x="5" y="9" width="6" height="32" fill="#75562f" stroke="#423018" stroke-width="0.8"/>
  <rect x="13" y="9" width="6" height="32" fill="#805e34" stroke="#423018" stroke-width="0.8"/>
  <rect x="21" y="9" width="6" height="32" fill="#6d4f2b" stroke="#3b2b17" stroke-width="0.8"/>
  <rect x="29" y="9" width="6" height="32" fill="#846237" stroke="#423018" stroke-width="0.8"/>
  <rect x="37" y="9" width="6" height="32" fill="#72532c" stroke="#3b2b17" stroke-width="0.8"/>
  <!-- Pregos metálicos rústicos nas tábuas -->
  <circle cx="8" cy="12" r="0.8" fill="#1b1b1b"/>
  <circle cx="8" cy="38" r="0.8" fill="#1b1b1b"/>
  <circle cx="16" cy="12" r="0.8" fill="#1b1b1b"/>
  <circle cx="16" cy="38" r="0.8" fill="#1b1b1b"/>
  <circle cx="24" cy="12" r="0.8" fill="#1b1b1b"/>
  <circle cx="24" cy="38" r="0.8" fill="#1b1b1b"/>
  <circle cx="32" cy="12" r="0.8" fill="#1b1b1b"/>
  <circle cx="32" cy="38" r="0.8" fill="#1b1b1b"/>
  <circle cx="40" cy="12" r="0.8" fill="#1b1b1b"/>
  <circle cx="40" cy="38" r="0.8" fill="#1b1b1b"/>
</svg>
