<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <rect width="50" height="50" fill="#0f220d"/>
  <!-- Copas de árvores sobrepostas formando bloqueio impenetrável -->
  <circle cx="25" cy="25" r="23" fill="#143611" stroke="#081707" stroke-width="1.5"/>
  <circle cx="15" cy="18" r="14" fill="#1b4617"/>
  <circle cx="35" cy="18" r="14" fill="#1e4d1a"/>
  <circle cx="25" cy="35" r="14" fill="#184015"/>
  <circle cx="25" cy="22" r="12" fill="#256120"/>
  <!-- Tronco central visível apenas na raiz -->
  <circle cx="25" cy="25" r="4" fill="#422f18" stroke="#22170b" stroke-width="0.8"/>
  <!-- Ramos e folhagem superior detalhada -->
  <circle cx="22" cy="18" r="7" fill="#327c2b"/>
  <circle cx="30" cy="24" r="8" fill="#388b30"/>
  <circle cx="18" cy="28" r="7" fill="#2b6b25"/>
  <!-- Pontos de folhagem brilhante -->
  <circle cx="21" cy="16" r="2" fill="#60be55" opacity="0.8"/>
  <circle cx="32" cy="22" r="2.2" fill="#60be55" opacity="0.8"/>
  <circle cx="26" cy="32" r="1.8" fill="#4ea544" opacity="0.8"/>
</svg>
